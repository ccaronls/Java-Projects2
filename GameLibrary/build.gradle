apply plugin: 'java-library'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin'

dependencies {
    implementation group: 'org.json', name: 'json', version: '20090211'
    api(project(':KSPCommon'))
    ksp(project(':KSPRem'))
    ksp(project(':KSPReflector'))
    ksp(project(':KSPNetCommand'))
}

sourceSets {
    main {
        java {
            srcDirs = [ 'src', 'apps' ]
        }
        resources {
            srcDirs = [ 'resources' ]
        }
    }

    test {
//        useJUnitPlatform()
        java {
            srcDirs = ['test']
        }

        resources {
            srcDirs = ['resources', 'testResources']
        }
    }

}

ksp {
    arg("net_command_registry_name", "GameLib")
    arg("package", "cc.lib.net2")
}
