}

task deployLearnToTypeApplet {
    dependsOn tasks.withType(Jar)
    group = 'Distribution'
    description = 'Deply the Learn to Type Applet to Sites'
    def homePath = System.properties['user.home']
    doLast {
        copy {
            from 'build/libs/GameLibrary.jar'
            into homePath + '/Sites/learnToType/'
        }
        copy {
            from 'html/TypingTeacher/'
            into homePath + '/Sites/learnToType/'
        }
    }
}

task deployZombicideApplet {
    dependsOn tasks.withType(Jar)
    group = 'Distribution'
    description = 'Deply the Zombicide Applet to Sites'
    def homePath = System.properties['user.home']
    def zPath = homePath + '/Sites/Zombicide/'
    doLast {
        delete zPath
        copy {
            from 'build/libs/GameLibraryApplet.jar'
            into zPath
        }
        copy {
            from 'html/Zombicide/'
            into zPath
        }
    }
}

tasks.register('fatJarRobotron', Jar) {
    group = 'Distribution'
    description = 'Robotron Swing Executable'

    archiveBaseName.set("RoboApp")

    dependsOn ':SuperRobotron:jar'
    dependsOn ':GameLibrary:jar'

    from {
        configurations.runtimeClasspath
                .filter { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(sourceSets.main.output) {
        include 'cc/lib/swing/**'
        include 'cc/applets/robotron/**'
        include 'robotron/*.gif'
    }
    from(project(":SuperRobotron").sourceSets.main.output)
    from(project(":GameLibrary").sourceSets.main.output)
    from(project(":GameLibrary").sourceSets.test.output)

    manifest {
        attributes["Main-Class"] = "cc.applets.robotron.RobotronApplet"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('fatJarZombicide', Jar) {
    group = 'Distribution'
    description = 'Zombicide Swing Executable'
    archiveBaseName.set("ZombieApp")

    dependsOn ':Zombicide:jar'
    dependsOn ':GameLibrary:jar'

    from {
        configurations.runtimeClasspath
                .filter { it.exists() }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(sourceSets.main.output) {
        include 'cc/lib/swing/**'
        include 'cc/applets/zombicide/**'
        include 'robotron/*.gif'
    }
    from(project(":Zombicide").sourceSets.main.output)
    from(project(":GameLibrary").sourceSets.main.output)
    from(file("../ZombicideAndroid/src/main/res/drawable"))
    from(file("../ZombicideAndroid/assets"))
    manifest {
        attributes["Main-Class"] = "cc.applets.zombicide.ZombicideApplet"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('zipApps', Zip) {
    doLast {
        group = 'distribution'
        dependsOn tasks.fatJarZombicide
        dependsOn tasks.fatJarRobotron

        archiveBaseName.set("javaApps")
        archiveVersion.set("1.0")
        destinationDirectory.set(file("$rootDir/zips"))

        from(bundleZombicideApplication.archiveFile) {
            into("") // place the JAR at root of ZIP
        }

        from(bundleRoboApplication.archiveFile) {
            into("") // place the JAR at root of ZIP
        }
    }
}