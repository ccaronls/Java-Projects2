apply plugin: 'java-library'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin'

dependencies {
    implementation project(':GameLibrary')
    ksp(project(":KSPNetCommand"))
    ksp(project(":KSPRem"))
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
    }
}

ksp {
    arg("package", "cc.game.dominos.core")
    arg("net_command_registry_name", "Dominos")
}